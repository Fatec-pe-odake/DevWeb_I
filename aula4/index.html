<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios JS</title>
</head>

<body>
    <h1>Exercícios de JavaScript</h1>

    <div class="ativ1">
        <h3>1 - botão desaparecer</h3>
        <button onclick="ativ1()" id="btn-desaparece">APERTE-ME E DESAPAREÇO</button>
    </div>

    <div class="ativ2">
        <h3>2 - caixa de texto div</h3>
        <input type="text" id="caixa-de-texto-ativ2">
        <button onclick="ativ2()">Trocar texto</button>
        <div id="div_ativ2">Troque meu texto</div>
    </div>

    <div class="ativ3">
        <h3>3 - pergunta</h3>
        <h3>Qual o país mais povoado do mundo?</h3>
        <select name="pergunta" id="pergunta_id">
            <option value="china">China</option>
            <option value="india">India</option>
            <option value="macau">Macau</option>
            <option value="eua">EUA</option>
            <option value="bangladesh">Bangladesh</option>
        </select>
        <button onclick="ativ3()" id="btn_verificar_ativ3">Verificar Resposta</button>
    </div>

    <div class="ativ4">
        <h3>4 - to do list</h3>
        <input type="text" id="tarefa" placeholder="Digite uma tarefa">
        <button onclick="ativ4()">Adicionar</button>
        <ul id="lista-4"></ul>
    </div>

    <div class="ativ5">
        <h3>5 - Conversor de Temperatura</h3>
        <input type="number" id="temperatura" placeholder="Digite a temperatura em °C">
        <button onclick="ativ5()">Adicionar</button>
        <div id="resultado"></div>
    </div>

    <div class="ativ6">
        <h3>6 - Semáforo</h3>

        <div class="semaforo-container" style="display: flex; gap: 20px; font-family: sans-serif;">
            <div class="conjunto" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div class="circulo1 red" style="width: 125px; height: 125px; border: 1px black solid; border-radius: 50%;"></div>
                <button class="btn-semaforos" onclick="ativ6('red')">ACENDER</button>
            </div>
            <div class="conjunto" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div class="circulo2 yellow" style="width: 125px; height: 125px; border: 1px black solid; border-radius: 50%;"></div>
                <button class="btn-semaforos" onclick="ativ6('yellow')">ACENDER</button>
            </div>
            <div class="conjunto" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div class="circulo3 green" style="width: 125px; height: 125px; border: 1px black solid; border-radius: 50%;"></div>
                <button class="btn-semaforos" onclick="ativ6('green')">ACENDER</button>
            </div>
        </div>
    </div>

    <div class="ativ7">
        <h3>7 - Tabuada</h3>
        <input type="number" id="numero" placeholder="Digite o numero para a tabuada">
        <button onclick="ativ7()">descobrir</button>      
        <div id="tabuada"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
