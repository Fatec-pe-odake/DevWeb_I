<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Navbar estilo Amazon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-amazon px-3">
  <div class="container-fluid d-flex align-items-center justify-content-between">

    <!-- Logo -->
    <div class="d-flex align-items-center me-3">
      <span class="logo">amazon</span>
    </div>

    <!-- Localização -->
    <div class="me-3">
      <div class="sub-text">Entrega em</div>
      <strong>Seu endereço</strong>
    </div>

    <!-- Barra de pesquisa -->
    <form class="d-flex search-bar me-3">
      <select class="form-select search-select" style="max-width: 80px;">
        <option>Todos</option>
      </select>

      <input class="form-control search-input" type="search" placeholder="Pesquisar..." />

      <button class="btn search-btn" type="submit">
        🔍
      </button>
    </form>

    <!-- Conta -->
    <div class="me-3">
      <div class="sub-text">Olá, faça login</div>
      <strong>Contas e Listas</strong>
    </div>

    <!-- Pedidos -->
    <div class="me-3">
      <div class="sub-text">Devoluções</div>
      <strong>e Pedidos</strong>
    </div>

    <!-- Carrinho -->
    <div>
      <strong>🛒 Carrinho</strong>
    </div>

  </div>
</nav>

</body>
</html>
