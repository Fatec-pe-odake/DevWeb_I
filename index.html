<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Dev Web I - Atividades</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="header-logo">Hub Fatec Atividades</div>
            <div class="header-right">
                <h3 class="header-subtitle">Desenvolvimento Web I</h3>
                <a href="https://github.com/pe-odake">
                    <img src="https://avatars.githubusercontent.com/u/165703800?v=4" class="header-avatar" alt="foto de pe-odake">
                </a>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <h1>Hub de Atividades da Aula</h1>
                <p>Explore o repositório oficial das nossas práticas e projetos.</p>
            </div>
        </section>
        <section class="section-atividades">
            <div class="container">
                <div class="section-header">
                    <div>
                        <h2 class="section-title">Repositório de Aulas</h2>
                        <p class="section-subtitle">Clique nos cards para explorar cada módulo detalhadamente</p>
                    </div>
                </div>
                <div class="grid" id="grid-atividades"></div>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-inner">
            <div class="footer-copy">© 2026 Pedro Odake. Hub Fatec Atividades.</div>
            <a href="https://github.com/pe-odake" class="footer-github">
                <svg viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path></svg>
                <span>GitHub</span>
            </a>
        </div>
    </footer>
    <script>
        fetch('atividades.json')
            .then(response => response.json())
            .then(atividades => {
                const grid = document.getElementById('grid-atividades');

                atividades.forEach((ativ, index) => {
                    const rowIndex = Math.floor(index / 2) + 1;
                    const isFirstInRow = index % 2 === 0;
                    let tamanho = '';
                    
                    if (rowIndex % 2 === 0) {
                        tamanho = isFirstInRow ? 'grande' : 'pequeno';
                    } else {
                        tamanho = isFirstInRow ? 'pequeno' : 'grande';
                    }

                    const card = document.createElement('a');
                    card.href = ativ.link;
                    card.className = tamanho === 'grande' ? 'card card-grande' : 'card card-pequeno';

                    let imagemHTML = '';
                    if (ativ.imagem) {
                        imagemHTML = `
                            <div class="card-img-wrapper">
                                <img src="${ativ.imagem}" alt="${ativ.titulo}" class="card-img">
                            </div>`;
                    } else if (ativ.icone) {
                        imagemHTML = `
                            <div class="card-icon-wrapper">
                                <span class="material-symbols-outlined">${ativ.icone}</span>
                            </div>`;
                    }

                    let dataHTML = '';
                    if (ativ.data) {
                        dataHTML = `<div class="card-tags"><span class="tag">${ativ.data}</span></div>`;
                    }

                    if (tamanho === 'grande') {
                        card.innerHTML = `
                            ${imagemHTML}
                            <div class="card-body">
                                <div class="card-body-header">
                                    <div>
                                        <h3 class="card-title">${ativ.titulo}</h3>
                                        <p class="card-desc">${ativ.descricao}</p>
                                    </div>
                                    <span class="material-symbols-outlined card-arrow">arrow_right_alt</span>
                                </div>
                                ${dataHTML}
                                <div class="card-footer-link">
                                    Ver atividade
                                    <span class="material-symbols-outlined">chevron_right</span>
                                </div>
                            </div>`;
                    } else {
                        card.innerHTML = `
                            ${imagemHTML}
                            <div class="card-body">
                                <h3 class="card-title">${ativ.titulo}</h3>
                                <p class="card-desc">${ativ.descricao}</p>
                                ${dataHTML}
                                <div class="card-footer-link">
                                    Ver atividade
                                    <span class="material-symbols-outlined">chevron_right</span>
                                </div>
                            </div>`;
                    }

                    grid.appendChild(card);
                });

                const cta = document.createElement('div');
                cta.className = 'cta-card';
                cta.innerHTML = `
                    <div class="cta-bg"></div>
                    <div class="cta-content">
                        <h2>Sempre com novos projetos!</h2>
                        <p>Colabore ou revise os códigos abertos no repositório.</p>
                        <a href="https://github.com/pe-odake" class="cta-btn">Acessar GitHub</a>
                    </div>`;
                grid.appendChild(cta);
            });
    </script>
</body>
</html>
